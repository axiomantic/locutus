name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build & Verify Linux Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version tag
        id: vars
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$VERSION" == "$GITHUB_REF" ]]; then
            VERSION="1.0.0-dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Locutus version ${VERSION}"

      - name: Setup asdf
        uses: asdf-vm/actions/setup@v3
        with:
          asdf_branch: v0.14.1

      - name: Install Nim via asdf-nim
        run: |
          . "$HOME/.asdf/asdf.sh"
          asdf plugin add nim https://github.com/asdf-community/asdf-nim.git
          asdf install nim 2.2.0
          asdf global nim 2.2.0
          echo "$HOME/.asdf/shims" >> $GITHUB_PATH
          echo "$HOME/.asdf/bin" >> $GITHUB_PATH

      - name: Install cross-compilation toolchains & QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-arm64-cross qemu-user-static curl
          mkdir -p /tmp/arm64-ssl
          PKG=$(curl -sL https://ports.ubuntu.com/ubuntu-ports/pool/main/o/openssl/ | grep -o 'href="libssl3[^"]*arm64\.deb"' | tr -d '"' | sed 's/href=//' | grep 'noble' | head -n 1 || true)
          if [ -z "$PKG" ]; then
            PKG=$(curl -sL https://ports.ubuntu.com/ubuntu-ports/pool/main/o/openssl/ | grep -o 'href="libssl3[^"]*arm64\.deb"' | tr -d '"' | sed 's/href=//' | head -n 1)
          fi
          echo "Installing arm64 OpenSSL library: ${PKG}"
          curl -sLo /tmp/arm64-ssl/libssl.deb "https://ports.ubuntu.com/ubuntu-ports/pool/main/o/openssl/${PKG}"
          dpkg-deb -x /tmp/arm64-ssl/libssl.deb /tmp/arm64-ssl/extracted
          sudo cp -d -r /tmp/arm64-ssl/extracted/usr/lib/aarch64-linux-gnu/* /usr/aarch64-linux-gnu/lib/ 2>/dev/null || true
          sudo cp -d -r /tmp/arm64-ssl/extracted/lib/aarch64-linux-gnu/* /usr/aarch64-linux-gnu/lib/ 2>/dev/null || true
          sudo ln -sf libcrypto.so.3 /usr/aarch64-linux-gnu/lib/libcrypto.so 2>/dev/null || true


      - name: Compile Linux x86_64 binary
        run: |
          mkdir -p dist/linux-amd64
          nim c -d:release --opt:speed -o:dist/linux-amd64/locutus src/locutus.nim
          strip dist/linux-amd64/locutus
          tar -czf dist/locutus-linux-amd64.tar.gz -C dist/linux-amd64 locutus

      - name: Compile Linux aarch64 binary
        run: |
          mkdir -p dist/linux-arm64
          nim c -d:release --opt:speed --cpu:arm64 --os:linux \
            --gcc.exe:aarch64-linux-gnu-gcc --gcc.linkerexe:aarch64-linux-gnu-gcc \
            -o:dist/linux-arm64/locutus src/locutus.nim
          aarch64-linux-gnu-strip dist/linux-arm64/locutus
          tar -czf dist/locutus-linux-arm64.tar.gz -C dist/linux-arm64 locutus

      - name: Build Debian packages (.deb)
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          # Build amd64 .deb
          mkdir -p deb-amd64/DEBIAN deb-amd64/usr/bin deb-amd64/usr/share/doc/locutus
          cp dist/linux-amd64/locutus deb-amd64/usr/bin/
          cp LICENSE deb-amd64/usr/share/doc/locutus/copyright
          cp README.md deb-amd64/usr/share/doc/locutus/
          chmod 755 deb-amd64/usr/bin/locutus
          printf "%s\n" \
            "Package: locutus" \
            "Version: ${VERSION}" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Maintainer: Axiomantic <info@axiomantic.org>" \
            "Description: Message exchange and routing for software agents over Redis" \
            " Standalone CLI client for inter-agent communication using Redis data" \
            " structures without an intermediate background daemon. Includes HMAC-SHA256" \
            " authentication, dead-agent pruning, and optional AES-256-CBC encryption." \
            > deb-amd64/DEBIAN/control
          dpkg-deb --build deb-amd64 dist/locutus_${VERSION}_amd64.deb

          # Build arm64 .deb
          mkdir -p deb-arm64/DEBIAN deb-arm64/usr/bin deb-arm64/usr/share/doc/locutus
          cp dist/linux-arm64/locutus deb-arm64/usr/bin/
          cp LICENSE deb-arm64/usr/share/doc/locutus/copyright
          cp README.md deb-arm64/usr/share/doc/locutus/
          chmod 755 deb-arm64/usr/bin/locutus
          printf "%s\n" \
            "Package: locutus" \
            "Version: ${VERSION}" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: arm64" \
            "Maintainer: Axiomantic <info@axiomantic.org>" \
            "Description: Message exchange and routing for software agents over Redis" \
            " Standalone CLI client for inter-agent communication using Redis data" \
            " structures without an intermediate background daemon. Includes HMAC-SHA256" \
            " authentication, dead-agent pruning, and optional AES-256-CBC encryption." \
            > deb-arm64/DEBIAN/control
          dpkg-deb --build deb-arm64 dist/locutus_${VERSION}_arm64.deb

      - name: Verify Linux packages in clean environment
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          echo "=== [1/4] Verifying Linux amd64 tarball ==="
          mkdir -p /tmp/clean-tar-amd64
          tar -xzf dist/locutus-linux-amd64.tar.gz -C /tmp/clean-tar-amd64
          /tmp/clean-tar-amd64/locutus --help | grep -F "Nim Native"
          KEY1=$(/tmp/clean-tar-amd64/locutus get-secret)
          test -n "$KEY1"

          echo "=== [2/4] Verifying Linux amd64 .deb package installation & uninstallation ==="
          sudo dpkg -i dist/locutus_${VERSION}_amd64.deb
          (cd /tmp && locutus --help | grep -F "Nim Native")
          KEY2=$(cd /tmp && locutus get-secret)
          test -n "$KEY2"
          sudo dpkg -r locutus
          if which locutus 2>/dev/null; then
            echo "Error: locutus should have been uninstalled"
            exit 1
          fi

          echo "=== [3/4] Verifying Linux arm64 tarball under QEMU ==="
          mkdir -p /tmp/clean-tar-arm64
          tar -xzf dist/locutus-linux-arm64.tar.gz -C /tmp/clean-tar-arm64
          qemu-aarch64-static -L /usr/aarch64-linux-gnu /tmp/clean-tar-arm64/locutus --help | grep -F "Nim Native"
          KEY3=$(qemu-aarch64-static -L /usr/aarch64-linux-gnu /tmp/clean-tar-arm64/locutus get-secret)
          test -n "$KEY3"

          echo "=== [4/4] Verifying Linux arm64 .deb extraction under QEMU ==="
          mkdir -p /tmp/clean-deb-arm64
          dpkg-deb -x dist/locutus_${VERSION}_arm64.deb /tmp/clean-deb-arm64
          qemu-aarch64-static -L /usr/aarch64-linux-gnu /tmp/clean-deb-arm64/usr/bin/locutus --help | grep -F "Nim Native"
          KEY4=$(qemu-aarch64-static -L /usr/aarch64-linux-gnu /tmp/clean-deb-arm64/usr/bin/locutus get-secret)
          test -n "$KEY4"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            dist/locutus-linux-amd64.tar.gz
            dist/locutus-linux-arm64.tar.gz
            dist/*.deb

  build-macos:
    name: Build & Verify macOS Packages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup asdf
        uses: asdf-vm/actions/setup@v3
        with:
          asdf_branch: v0.14.1

      - name: Install Nim via asdf-nim
        run: |
          . "$HOME/.asdf/asdf.sh"
          asdf plugin add nim https://github.com/asdf-community/asdf-nim.git
          asdf install nim 2.2.0
          asdf global nim 2.2.0
          echo "$HOME/.asdf/shims" >> $GITHUB_PATH
          echo "$HOME/.asdf/bin" >> $GITHUB_PATH

      - name: Compile macOS Apple Silicon (arm64) binary
        run: |
          mkdir -p dist/darwin-arm64
          nim c -d:release --opt:speed --cpu:arm64 -o:dist/darwin-arm64/locutus src/locutus.nim
          strip dist/darwin-arm64/locutus
          tar -czf dist/locutus-darwin-arm64.tar.gz -C dist/darwin-arm64 locutus

      - name: Compile macOS Intel (x86_64) binary
        run: |
          mkdir -p dist/darwin-amd64
          nim c -d:release --opt:speed --cpu:amd64 \
            --passC:"-target x86_64-apple-macos11" \
            --passL:"-target x86_64-apple-macos11" \
            -o:dist/darwin-amd64/locutus src/locutus.nim
          strip dist/darwin-amd64/locutus
          tar -czf dist/locutus-darwin-amd64.tar.gz -C dist/darwin-amd64 locutus

      - name: Verify macOS packages in clean environment
        run: |
          echo "=== [1/2] Verifying macOS arm64 tarball ==="
          mkdir -p /tmp/clean-darwin-arm64
          tar -xzf dist/locutus-darwin-arm64.tar.gz -C /tmp/clean-darwin-arm64
          /tmp/clean-darwin-arm64/locutus --help | grep -F "Nim Native"
          KEY1=$(/tmp/clean-darwin-arm64/locutus get-secret)
          test -n "$KEY1"

          echo "=== [2/2] Verifying macOS amd64 tarball via Rosetta 2 ==="
          mkdir -p /tmp/clean-darwin-amd64
          tar -xzf dist/locutus-darwin-amd64.tar.gz -C /tmp/clean-darwin-amd64
          arch -x86_64 /tmp/clean-darwin-amd64/locutus --help | grep -F "Nim Native"
          KEY2=$(arch -x86_64 /tmp/clean-darwin-amd64/locutus get-secret)
          test -n "$KEY2"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: |
            dist/locutus-darwin-arm64.tar.gz
            dist/locutus-darwin-amd64.tar.gz

  build-windows:
    name: Build & Verify Windows Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Nim compiler
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up official Nimble & DLLs
        uses: nim-lang/setup-nimble-action@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile native Windows binary
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows-amd64
          nim c -d:release --opt:speed -o:dist\windows-amd64\locutus.exe src\locutus.nim
          Compress-Archive -Path dist\windows-amd64\locutus.exe -DestinationPath dist\locutus-windows-amd64.zip -Force

      - name: Verify Windows zip package in clean environment
        shell: powershell
        run: |
          Write-Host "=== [1/2] Verifying Windows zip in clean directory ==="
          Expand-Archive -Path "dist/locutus-windows-amd64.zip" -DestinationPath "C:\clean-locutus-test" -Force
          $helpOutput = & "C:\clean-locutus-test\locutus.exe" --help
          Write-Host $helpOutput
          if (-not ($helpOutput -match "Nim Native")) {
            throw "locutus.exe --help failed verification"
          }
          $secretOutput = & "C:\clean-locutus-test\locutus.exe" get-secret
          Write-Host "Secret: $secretOutput"
          if ([string]::IsNullOrWhiteSpace($secretOutput)) {
            throw "locutus.exe get-secret failed verification"
          }

          Write-Host "=== [2/2] Validating Scoop manifest schema ==="
          $scoopManifest = Get-Content -Raw "packaging/scoop/locutus.json" | ConvertFrom-Json
          if ($scoopManifest.architecture."64bit".bin -ne "locutus.exe") {
            throw "Invalid Scoop manifest binary target"
          }
          Write-Host "Scoop manifest syntax verified successfully."

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            dist/locutus-windows-amd64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute SHA256 Checksums
        run: |
          cd release-assets
          sha256sum locutus-* *.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
