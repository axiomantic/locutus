name: LLM CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      model:
        description: 'LLM Model to test with on OpenRouter (e.g. deepseek/deepseek-chat or nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free)'
        required: false
        default: 'deepseek/deepseek-chat'

jobs:
  llm-integration:
    name: LLM Integration Tests (OpenRouter)
    runs-on: ubuntu-latest
    environment: llm-ci

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install redis-tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y redis-tools
          redis-cli ping

      - name: Setup asdf
        uses: asdf-vm/actions/setup@v3
        with:
          asdf_branch: v0.14.1

      - name: Install Nim via asdf-nim
        run: |
          . "$HOME/.asdf/asdf.sh"
          asdf plugin add nim https://github.com/asdf-community/asdf-nim.git
          asdf install nim 2.2.0
          asdf global nim 2.2.0
          echo "$HOME/.asdf/shims" >> $GITHUB_PATH
          echo "$HOME/.asdf/bin" >> $GITHUB_PATH

      - name: Verify Nim compiler
        run: |
          which nim
          nim -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.0" skilz pytest

      - name: Compile native Nim binary
        run: scripts/ci/build.sh

      - name: Run LLM Integration Tests
        env:
          LOCUTUS_REDIS_URL: redis://127.0.0.1:6379
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ inputs.model }}

        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error ::LLM_API_KEY secret is not present in this runner environment."
            echo "For fork PRs, approval on the 'llm-ci' environment is required to access repository secrets."
            exit 1
          fi
          export LLM_MODEL="${LLM_MODEL:-deepseek/deepseek-chat}"
          python -m pytest -v -m llm -s

