name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux:
    name: Tests (Ubuntu / asdf-nim)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install redis-tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y redis-tools
          redis-cli ping

      - name: Setup asdf
        uses: asdf-vm/actions/setup@v3
        with:
          asdf_branch: v0.14.1

      - name: Install Nim via asdf-nim
        run: |
          . "$HOME/.asdf/asdf.sh"
          asdf plugin add nim https://github.com/asdf-community/asdf-nim.git
          asdf install nim 2.2.0
          asdf global nim 2.2.0
          echo "$HOME/.asdf/shims" >> $GITHUB_PATH
          echo "$HOME/.asdf/bin" >> $GITHUB_PATH

      - name: Verify Nim compiler
        run: |
          which nim
          nim -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.0" skilz pytest

      - name: Compile native Nim binary
        run: |
          mkdir -p bin
          nim c -d:release -o:bin/locutus src/locutus.nim
          ./bin/locutus --help

      - name: Run test suite
        env:
          LOCUTUS_REDIS_URL: redis://127.0.0.1:6379
        run: |
          pytest -v -m "not llm"

  test-macos:
    name: Tests (macOS / asdf-nim)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install and start Redis
        run: |
          brew install redis
          brew services start redis
          sleep 2
          redis-cli ping

      - name: Setup asdf
        uses: asdf-vm/actions/setup@v3
        with:
          asdf_branch: v0.14.1

      - name: Install Nim via asdf-nim
        run: |
          . "$HOME/.asdf/asdf.sh"
          asdf plugin add nim https://github.com/asdf-community/asdf-nim.git
          asdf install nim 2.2.0
          asdf global nim 2.2.0
          echo "$HOME/.asdf/shims" >> $GITHUB_PATH
          echo "$HOME/.asdf/bin" >> $GITHUB_PATH

      - name: Verify Nim compiler
        run: |
          which nim
          nim -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.0" skilz pytest

      - name: Compile native Nim binary
        run: |
          mkdir -p bin
          nim c -d:release -o:bin/locutus src/locutus.nim
          ./bin/locutus --help

      - name: Run test suite
        env:
          LOCUTUS_REDIS_URL: redis://127.0.0.1:6379
        run: |
          pytest -v -m "not llm"

  test-windows:
    name: Tests (Windows / setup-nimble-action)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install and start Redis
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/tporadowski/redis/releases/download/v5.0.14.1/Redis-x64-5.0.14.1.zip" -OutFile "redis.zip"
          Expand-Archive -Path "redis.zip" -DestinationPath "C:\redis"
          "C:\redis" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Start-Process -FilePath "C:\redis\redis-server.exe"
          Start-Sleep -Seconds 2
          & "C:\redis\redis-cli.exe" ping

      - name: Set up Nim compiler
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up official Nimble & DLLs
        uses: nim-lang/setup-nimble-action@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Nim and Nimble
        shell: bash
        run: |
          which nim
          nim -v
          which nimble
          nimble -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.0" skilz pytest

      - name: Compile native Nim binary
        shell: bash
        run: |
          mkdir -p bin
          nim c -d:release -o:bin/locutus.exe src/locutus.nim
          ./bin/locutus.exe --help

      - name: Run test suite
        shell: bash
        env:
          LOCUTUS_REDIS_URL: redis://127.0.0.1:6379
          PYTHONUTF8: "1"
        run: |
          pytest -v -m "not llm"
