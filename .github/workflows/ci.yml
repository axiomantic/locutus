name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux:
    name: Tests (Ubuntu / vfox-nim)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install redis-tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y redis-tools
          redis-cli ping

      - name: Set up Nim via mise (vfox-nim)
        uses: jdx/mise-action@v4
        with:
          tool_versions: |
            vfox:elijahr/vfox-nim 2.2.0
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Nim compiler
        run: |
          which nim
          nim -v
          which nimble
          nimble -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: scripts/ci/install-deps.sh

      - name: Compile native Nim binary
        run: scripts/ci/build.sh

      - name: Run test suite
        env:
          LOCUTUS_REDIS_URL: redis://127.0.0.1:6379
        run: scripts/ci/test.sh

  # NOTE: The macOS leg is GitHub-Actions-only because the self-hosted
  # Forgejo runner is Linux/Podman-only; no private macOS runner capacity exists.
  test-macos:
    name: Tests (macOS / vfox-nim)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install and start Redis
        run: |
          brew install redis
          brew services start redis
          sleep 2
          redis-cli ping

      - name: Set up Nim via mise (vfox-nim)
        uses: jdx/mise-action@v4
        with:
          tool_versions: |
            vfox:elijahr/vfox-nim 2.2.0
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Nim compiler
        run: |
          which nim
          nim -v
          which nimble
          nimble -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: scripts/ci/install-deps.sh

      - name: Compile native Nim binary
        run: scripts/ci/build.sh

      - name: Run test suite
        env:
          LOCUTUS_REDIS_URL: redis://127.0.0.1:6379
        run: scripts/ci/test.sh

  # NOTE: The Windows leg is GitHub-Actions-only because the self-hosted
  # Forgejo runner is Linux/Podman-only; no private Windows runner capacity exists.
  test-windows:
    name: Tests (Windows / vfox-nim)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install and start Redis
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/tporadowski/redis/releases/download/v5.0.14.1/Redis-x64-5.0.14.1.zip" -OutFile "redis.zip"
          Expand-Archive -Path "redis.zip" -DestinationPath "C:\redis"
          "C:\redis" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Start-Process -FilePath "C:\redis\redis-server.exe"
          Start-Sleep -Seconds 2
          & "C:\redis\redis-cli.exe" ping

      - name: Set up Nim via mise (vfox-nim)
        uses: jdx/mise-action@v4
        with:
          tool_versions: |
            vfox:elijahr/vfox-nim 2.2.0
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Windows requires runtime DLLs for HTTPS and SSL support in Nimble
      - name: Install Nim Windows runtime DLLs
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest https://nim-lang.org/download/dlls.zip -OutFile dlls.zip
          Expand-Archive dlls.zip -DestinationPath "$env:GITHUB_WORKSPACE\nim-dlls" -Force
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\nim-dlls"
          Invoke-WebRequest https://curl.se/ca/cacert.pem -OutFile "$env:GITHUB_WORKSPACE\cacert.pem"
          Add-Content $env:GITHUB_ENV "SSL_CERT_FILE=$env:GITHUB_WORKSPACE\cacert.pem"

      - name: Verify Nim and Nimble
        shell: bash
        run: |
          which nim
          nim -v
          which nimble
          nimble -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.0" skilz pytest

      - name: Compile native Nim binary
        shell: bash
        run: |
          mkdir -p bin
          nim c -d:release -o:bin/locutus.exe src/locutus.nim
          ./bin/locutus.exe --help

      - name: Run test suite
        shell: bash
        env:
          LOCUTUS_REDIS_URL: redis://127.0.0.1:6379
          PYTHONUTF8: "1"
        run: |
          python -m pytest -v -m "not llm"

