name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Nim
        uses: jasonr/nim-action@v1
        with:
          version: '2.2.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic>=2.0

      - name: Compile native Nim binary
        run: |
          mkdir -p bin
          nim c -d:release -o:bin/locutus src/locutus.nim
          ./bin/locutus --help

      - name: Run test suite
        env:
          LOCUTUS_REDIS_URL: redis://127.0.0.1:6379
        run: |
          python -m unittest discover tests
