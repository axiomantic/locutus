name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }} / vfox-nim)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Start Redis (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y redis-server redis-tools
          sudo systemctl start redis-server
          redis-cli ping

      - name: Start Redis (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install redis
          brew services start redis
          sleep 2
          redis-cli ping

      - name: Start Redis (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/tporadowski/redis/releases/download/v5.0.14.1/Redis-x64-5.0.14.1.zip" -OutFile "redis.zip"
          Expand-Archive -Path "redis.zip" -DestinationPath "C:\redis"
          "C:\redis" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Start-Process -FilePath "C:\redis\redis-server.exe"
          Start-Sleep -Seconds 2
          & "C:\redis\redis-cli.exe" ping

      - name: Set up Nim via mise (vfox-nim)
        uses: jdx/mise-action@v4
        with:
          tool_versions: |
            vfox:elijahr/vfox-nim 2.2.0
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Windows requires runtime DLLs for HTTPS and SSL support in Nimble
      - name: Install Nim Windows runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest https://nim-lang.org/download/dlls.zip -OutFile dlls.zip
          Expand-Archive dlls.zip -DestinationPath "$env:GITHUB_WORKSPACE\nim-dlls" -Force
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\nim-dlls"
          Invoke-WebRequest https://curl.se/ca/cacert.pem -OutFile "$env:GITHUB_WORKSPACE\cacert.pem"
          Add-Content $env:GITHUB_ENV "SSL_CERT_FILE=$env:GITHUB_WORKSPACE\cacert.pem"

      - name: Verify Nim compiler
        run: |
          which nim
          nim -v
          which nimble
          nimble -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: scripts/ci/install-deps.sh

      - name: Compile native Nim binary
        run: scripts/ci/build.sh

      - name: Run test suite
        env:
          LOCUTUS_REDIS_URL: redis://127.0.0.1:6379
          PYTHONUTF8: "1"
        run: scripts/ci/test.sh

