[project]
name = "locutus"
version = "0.1.2"
description = "Fast, daemonless, multi-agent coordination layer and secure inter-assistant messaging bus"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
    "pytest-tripwire>=0.21.1",
    "redis>=5.0.0",
]

[project.entry-points."tripwire.plugins"]
locutus = "tests.tripwire_locutus:LocutusPlugin"

[tool.tripwire]
guard = "off"

